services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: motoservices
      POSTGRES_USER: motoservices
      POSTGRES_PASSWORD: motoservices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motoservices -d motoservices"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/motoservices
      DB_USER: motoservices
      DB_PASS: motoservices
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
