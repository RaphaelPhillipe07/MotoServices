# Perfil de desenvolvimento: parametrizado por variáveis de ambiente,
# com valores padrão apenas para a máquina local.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:motoservices}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true

# Segredo e senha inicial apenas para desenvolvimento local.
motoservices:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-motoservices-jwt-secret-nao-use-em-producao-0123456789}
    admin:
      senha: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    org.hibernate.SQL: debug
