spring:
  application:
    name: motoservices

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: motoservices
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: motoservices
    schemas: motoservices

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: MotoServices
    version: 0.4.0

logging:
  level:
    root: info
    br.com.motoservices: info
