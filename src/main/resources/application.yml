spring:
  application:
    name: motoservices

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: motoservices
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: motoservices
    schemas: motoservices

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Autenticação: segredos vêm dos perfis (dev/prod) ou do ambiente.
motoservices:
  security:
    jwt:
      issuer: motoservices
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    admin:
      habilitado: ${ADMIN_BOOTSTRAP:true}
      username: ${ADMIN_USERNAME:admin}
      nome: ${ADMIN_NOME:Administrador}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: MotoServices
    version: 0.4.0

logging:
  level:
    root: info
    br.com.motoservices: info
